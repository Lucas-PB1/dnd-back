    name: "Anel de Evasão"
    kind: unique
    requiresAttunement: true
    resource: { slug: anelEvasaoCharges, fixed_max: 3 }
    abilities:
      - id: item-anel-de-evasao-usar
        name: "Anel de Evasão · Sucesso"
