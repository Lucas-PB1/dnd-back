# Taxonomia — lote §0 #5 (1 pool + 1 botão)
# Total: 5
# Padrão Anel dos Barris: resource max N + spend-resource (1 carga)
# MVP: recover_all_on_long (texto = 1dN ao amanhecer)

meta:
  fase: 3-wiring
  padrao: charge-pool-single
  nota: |
    Um botão por item; spend_amount 1.
    Sem gasto variável 1–K (isso é §0 #10).
    Sem lista multi-magia de varinha/cajado (§0 #7–#8).

items:
