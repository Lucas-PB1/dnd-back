# Taxonomia — §0 #7 varinhas
# Total: 12 (3 iniciais + 9 lote #9h; faltam Orcus / Maravilhas)
# Pool compartilhado por varinha; spend_amount = custo da magia
# MVP: recover_all_on_long; destruição no 1 ao gastar última carga = nota no texto
# Cast/link magia = fase 6

meta:
  fase: 4-wiring
  padrao: wand-multi-spell
  nota: |
    Sem cast automático — spend-resource + lembrete de mesa.
    Mísseis: botões 1/2/3 cargas (círculo 1/2/3).

